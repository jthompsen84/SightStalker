[project]
name = "sightstalker"
version = "0.4.5"
description = "Modular browser automation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "filelock>=3,<4",
    "SQLAlchemy[asyncio]>=2,<3",
    "alembic>=1.13,<2",
    "aiosqlite>=0.19,<1",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "tenacity>=8.2,<10",
    "loguru>=0.7,<1",
]

[project.scripts]
sightstalker = "sightstalker.cli.main:app"

[project.optional-dependencies]
camoufox = [
    "camoufox>=0.4.11,<0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sightstalker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "browser_smoke: real Camoufox browser smoke tests requiring installed browser binary",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
